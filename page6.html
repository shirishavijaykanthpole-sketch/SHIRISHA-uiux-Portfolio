<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattadh Branding | Shirisha Portfolio</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg: #0d0d0d;
            --white: #f0ece4;
            --muted: rgba(255, 255, 255, 0.4);
            --accent-red: #e03030;
            --panel-bg: rgba(30, 30, 30, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        /* ── RESET & BASE styles ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* ── CASE STUDY CONTAINER ── */
        .case-study-container {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── SINGLE HIGH-RES IMAGE SHOWCASE ── */
        .showcase-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            
            /* Smooth page entrance animation */
            opacity: 0;
            transform: translateY(15px);
            animation: imageFadeIn 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* ── FLOATING CONTROLS ── */
        .close-case-study {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50%;
            border: 1px solid var(--border-color);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .close-case-study i {
            font-size: 1.25rem;
            transition: transform 0.3s ease;
        }

        .close-case-study:hover {
            background: var(--accent-red);
            border-color: var(--accent-red);
            transform: scale(1.05);
        }
        
        .close-case-study:hover i {
            transform: rotate(90deg);
        }

        /* ── SCROLL HINT ── */
        .scroll-hint {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 990;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .scroll-hint i {
            font-size: 1.5rem;
            color: var(--white);
            animation: floatDown 2s infinite ease-in-out;
        }

        .scroll-hint.hidden {
            opacity: 0;
            transform: translate(-50%, 15px);
        }

        /* ── ANIMATIONS ── */
        @keyframes imageFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatDown {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(6px); opacity: 0.9; }
        }

        /* ── RESPONSIVE DESIGN ── */
        @media (max-width: 768px) {
            .close-case-study {
                top: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
            }
            .scroll-hint {
                bottom: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- Back to Project Gallery -->
    <a href="indexx.html" class="close-case-study" aria-label="Close Case Study">
        <i class="bi bi-x-lg"></i>
    </a>

    <!-- Scroll Indicator -->
    <div class="scroll-hint" id="scrollHint">
        <i class="bi bi-chevron-down"></i>
    </div>

    <!-- Layout Wrapper -->
    <main class="case-study-container">
        <img src="branding.png" alt="Pattadh Branding Case Study Showcase" class="showcase-image">
    </main>

    <script>
        // Efficient scroll monitoring to hide the indicator smoothly
        const scrollHint = document.getElementById("scrollHint");
        
        window.addEventListener("scroll", () => {
            if (window.scrollY > 150) {
                scrollHint.classList.add("hidden");
            } else {
                scrollHint.classList.remove("hidden");
            }
        }, { passive: true });
    </script>

</body>
</html>
